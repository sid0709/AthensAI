# Cap WiredTiger cache when mongod shares the Athens VPS.
# Default is ~50% of RAM, which races the Node processes for memory.
#
# Install: copy to /etc/mongod.conf (merge into existing storage:) and restart mongod.
# Or run docker/tune-mongod-cache.sh on the VPS (runtime, no restart).

storage:
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # Large API payloads (e.g. recording-related). Cap ~4GB.
    client_max_body_size 4096m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        root /app/Athens/dist;
        index index.html;

        # Public backend health used by the browser extension. Keep this exact
        # route ahead of the SPA fallback so callers receive JSON, not index.html.
        location = /healthz {
            proxy_pass http://127.0.0.1:8980/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /readyz {
            proxy_pass http://127.0.0.1:8980/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/background-tasks/events {
            proxy_pass http://127.0.0.1:8980/api/background-tasks/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8980/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Large recording-related uploads.
            client_max_body_size 4096m;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            proxy_request_buffering off;
        }

        # Legacy /personal/* callers → Nest global prefix /api/personal/*
        location /personal/ {
            proxy_pass http://127.0.0.1:8980/api/personal/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600;
            proxy_send_timeout 600;
            proxy_request_buffering off;
        }

        # Chrome extension zips + manifest packed at image build time (Apps & Plugins).
        location /downloads/ {
            root /app/Athens/dist;
            add_header Cache-Control 'public, max-age=300';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

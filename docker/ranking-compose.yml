services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      default:
        aliases:
          - redis

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases:
          - qdrant

networks:
  default:
    external: true
    name: ${ATHENS_DOCKER_NETWORK:-athens-monitoring}

volumes:
  redis_data:
    name: ${REDIS_DATA_VOLUME:-nextoffer-redis-data}
  qdrant_storage:
    name: ${QDRANT_DATA_VOLUME:-nextoffer-qdrant-data}

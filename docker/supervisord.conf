[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; API process: no embedded worker. Heap stays well under VPS RAM so V8 GCs.
[program:athens-backend]
command=node --max-old-space-size=%(ENV_NODE_MAX_OLD_SPACE_SIZE)s dist/main.js
directory=/app/athens-backend
environment=NODE_ENV="production",PORT="8980",HOST="0.0.0.0",PUBLIC_PORT="80",PUBLIC_STATUS_CHECK_URL="http://127.0.0.1/api/status/current",DATABASE_URL="%(ENV_DATABASE_URL)s",API_KEYS_ENCRYPTION_KEY="%(ENV_API_KEYS_ENCRYPTION_KEY)s",FIREBASE_PROJECT_ID="%(ENV_FIREBASE_PROJECT_ID)s",FIREBASE_STORAGE_BUCKET="%(ENV_FIREBASE_STORAGE_BUCKET)s",GOOGLE_APPLICATION_CREDENTIALS="%(ENV_GOOGLE_APPLICATION_CREDENTIALS)s",BACKGROUND_WORKERS_MODE="off",WORKER_HEALTH_URL="%(ENV_WORKER_HEALTH_URL)s",METRICS_PORT="9101",MONITORING_ENABLED="true",PROMETHEUS_URL="%(ENV_PROMETHEUS_URL)s",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s"
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Background worker in a separate Node process so mail/resume/job-pool work
; cannot grow the API heap. Not published outside the container.
[program:athens-worker]
command=node --max-old-space-size=%(ENV_NODE_WORKER_MAX_OLD_SPACE_SIZE)s dist/main.js
directory=/app/athens-backend
environment=NODE_ENV="production",PORT="%(ENV_WORKER_PORT)s",HOST="127.0.0.1",DATABASE_URL="%(ENV_DATABASE_URL)s",API_KEYS_ENCRYPTION_KEY="%(ENV_API_KEYS_ENCRYPTION_KEY)s",FIREBASE_PROJECT_ID="%(ENV_FIREBASE_PROJECT_ID)s",FIREBASE_STORAGE_BUCKET="%(ENV_FIREBASE_STORAGE_BUCKET)s",GOOGLE_APPLICATION_CREDENTIALS="%(ENV_GOOGLE_APPLICATION_CREDENTIALS)s",BACKGROUND_WORKERS_MODE="worker",METRICS_ENABLED="false",MONITORING_ENABLED="false",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s"
autostart=true
autorestart=true
priority=40
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=100
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

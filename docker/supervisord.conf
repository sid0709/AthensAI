[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:athens-backend]
command=node --max-old-space-size=8192 dist/main.js
directory=/app/athens-backend
environment=NODE_ENV="production",PORT=8980,HOST="0.0.0.0",PUBLIC_PORT=80,PUBLIC_STATUS_CHECK_URL="http://127.0.0.1/api/status/current",DATABASE_URL="%(ENV_DATABASE_URL)s",API_KEYS_ENCRYPTION_KEY="%(ENV_API_KEYS_ENCRYPTION_KEY)s",FIREBASE_PROJECT_ID="%(ENV_FIREBASE_PROJECT_ID)s",FIREBASE_STORAGE_BUCKET="%(ENV_FIREBASE_STORAGE_BUCKET)s",GOOGLE_APPLICATION_CREDENTIALS="%(ENV_GOOGLE_APPLICATION_CREDENTIALS)s",BACKGROUND_WORKERS_MODE="embedded",METRICS_PORT=9101,MONITORING_ENABLED="true",PROMETHEUS_URL="%(ENV_PROMETHEUS_URL)s",CORS_ORIGIN="%(ENV_CORS_ORIGIN)s"
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=100
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

groups:
  - name: athens-recording
    interval: 30s
    rules:
      - record: athens:node_cpu_utilization:ratio
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      # Used ratio = 1 - available/total (NOT available/total).
      - record: athens:node_memory_utilization:ratio
        expr: 1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})
      - record: athens:root_filesystem_utilization:ratio
        expr: 1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})
      - record: athens:node_load_utilization:ratio
        expr: node_load1 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"})
      - record: athens:node_uptime_seconds
        expr: time() - node_boot_time_seconds
      - record: athens:public_probe_success:ratio
        expr: avg_over_time(probe_success{job="public-http"}[5m])
      - record: athens:http_5xx_rate:ratio
        expr: sum(rate(athens_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(athens_http_requests_total[5m])), 1)

  - name: athens-alerts
    rules:
      - alert: AthensNodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS metrics are unavailable
          description: Prometheus has been unable to scrape node-exporter for more than two minutes.
      - alert: AthensPublicProbeDown
        expr: probe_success{job="public-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens public endpoint is unavailable
          description: The public synthetic probe has failed for more than two minutes.
      - alert: AthensReadinessDown
        expr: athens_health_status{component="athens-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens API is not ready
          description: athens-backend readiness has failed for more than two minutes.
      - alert: AthensDiskAlmostFull
        expr: athens:root_filesystem_utilization:ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Athens VPS disk usage is high
          description: Root filesystem usage is above 85 percent.
      - alert: AthensDiskCritical
        expr: athens:root_filesystem_utilization:ratio > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS disk usage is critical
          description: Root filesystem usage is above 90 percent.
      - alert: AthensMemoryPressure
        expr: 1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Athens VPS memory pressure is high
          description: Available-aware memory usage is above 90 percent.
      - alert: AthensMemoryCritical
        expr: 1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS memory pressure is critical
          description: Available-aware memory usage is above 95 percent.
      - alert: AthensCpuPressure
        expr: athens:node_cpu_utilization:ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Athens VPS CPU usage is high
          description: Five-minute CPU utilization is above 85 percent.
      - alert: AthensCpuCritical
        expr: athens:node_cpu_utilization:ratio > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS CPU usage is critical
          description: Five-minute CPU utilization is above 95 percent.
      - alert: AthensHighErrorRate
        expr: athens:http_5xx_rate:ratio > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Athens HTTP error rate is high
          description: More than five percent of requests are returning 5xx responses.
      - alert: AthensMonitoringCycleMissing
        expr: absent(athens_monitor_cycle_timestamp_seconds)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens monitoring cycle is missing
          description: Prometheus has not received a monitoring-cycle timestamp.
      - alert: AthensMonitoringCycleStale
        expr: time() - athens_monitor_cycle_timestamp_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Athens monitoring cycle is stale
          description: The application has not completed dependency checks within 120 seconds.
      - alert: AthensStatusPersistenceFailed
        expr: athens_monitor_persistence_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Firestore status snapshot persistence is failing
          description: Health remains visible in Prometheus, but the public fallback snapshot is not updating.
      - alert: AthensApplicationMetricsDown
        expr: up{job="athens-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Cluster-wide application metrics are unavailable
          description: Prometheus cannot scrape the private athens-backend metrics listener on port 9101.
      - alert: AthensTaskWorkerUnavailable
        expr: athens_health_status{component="background-tasks"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Background task workers are unavailable
          description: No healthy embedded worker heartbeat or lease processing is available.
      - alert: AthensTaskQueueDelayed
        expr: athens_background_queue_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Firestore task queue is delayed
          description: The oldest runnable background task has waited more than five minutes.
      - alert: AthensTaskLeasesExpired
        expr: athens_background_expired_lease_count > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Background task leases have expired
          description: One or more running Firestore task leases need recovery.
      - alert: AthensAlgoliaSyncDelayed
        expr: athens_algolia_outbox_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Algolia synchronization is delayed
          description: The oldest search outbox record is more than five minutes old.

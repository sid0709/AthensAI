groups:
  - name: athens-recording
    interval: 30s
    rules:
      - record: athens:node_cpu_utilization:ratio
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - record: athens:node_memory_utilization:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
      - record: athens:root_filesystem_utilization:ratio
        expr: 1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})
      - record: athens:node_load_utilization:ratio
        expr: node_load1 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"})
      - record: athens:node_uptime_seconds
        expr: time() - node_boot_time_seconds
      - record: athens:public_probe_success:ratio
        expr: avg_over_time(probe_success{job="public-http"}[5m])
      - record: athens:http_5xx_rate:ratio
        expr: sum(rate(athens_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(athens_http_requests_total[5m])), 1)
      - record: athens:redis_cache_hit_rate:ratio
        expr: sum(rate(redis_keyspace_hits_total[5m])) / clamp_min(sum(rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])), 1)
      - record: athens:qdrant_error_rate:ratio
        expr: (sum(rate(rest_responses_total{status=~"4..|5.."}[5m])) or vector(0)) / clamp_min((sum(rate(rest_responses_total[5m])) or vector(0)), 1)
      - record: athens:qdrant_p95_latency_seconds
        expr: histogram_quantile(0.95, sum by (le) (rate(rest_responses_duration_seconds_bucket[5m])))

  - name: athens-alerts
    rules:
      - alert: AthensNodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS metrics are unavailable
          description: Prometheus has been unable to scrape node-exporter for more than two minutes.
      - alert: AthensPublicProbeDown
        expr: probe_success{job="public-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens public endpoint is unavailable
          description: The public synthetic probe has failed for more than two minutes.
      - alert: AthensReadinessDown
        expr: athens_health_status{component="athens-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens API is not ready
          description: Athens-server readiness has failed for more than two minutes.
      - alert: AthensDiskAlmostFull
        expr: athens:root_filesystem_utilization:ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Athens VPS disk usage is high
          description: Root filesystem usage is above 85 percent.
      - alert: AthensDiskCritical
        expr: athens:root_filesystem_utilization:ratio > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS disk usage is critical
          description: Root filesystem usage is above 90 percent.
      - alert: AthensMemoryPressure
        expr: athens:node_memory_utilization:ratio > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Athens VPS memory pressure is high
          description: Available-aware memory usage is above 90 percent.
      - alert: AthensMemoryCritical
        expr: athens:node_memory_utilization:ratio > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS memory pressure is critical
          description: Available-aware memory usage is above 95 percent.
      - alert: AthensCpuPressure
        expr: athens:node_cpu_utilization:ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Athens VPS CPU usage is high
          description: Five-minute CPU utilization is above 85 percent.
      - alert: AthensCpuCritical
        expr: athens:node_cpu_utilization:ratio > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens VPS CPU usage is critical
          description: Five-minute CPU utilization is above 95 percent.
      - alert: AthensHighErrorRate
        expr: athens:http_5xx_rate:ratio > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Athens HTTP error rate is high
          description: More than five percent of requests are returning 5xx responses.
      - alert: AthensMonitoringCycleMissing
        expr: absent(athens_monitor_cycle_timestamp_seconds)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens monitoring cycle is missing
          description: Prometheus has not received a monitoring-cycle timestamp.
      - alert: AthensMonitoringCycleStale
        expr: time() - athens_monitor_cycle_timestamp_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Athens monitoring cycle is stale
          description: The application has not completed dependency checks within 120 seconds.
      - alert: AthensStatusPersistenceFailed
        expr: athens_monitor_persistence_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Firestore status snapshot persistence is failing
          description: Health remains visible in Prometheus, but the public fallback snapshot is not updating.
      - alert: AthensApplicationMetricsDown
        expr: up{job="athens-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Cluster-wide application metrics are unavailable
          description: Prometheus cannot scrape the private Athens metrics listener on port 9101.
      - alert: AthensBackgroundWorkerMetricsDown
        expr: up{job="athens-background-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Athens background worker metrics are unavailable
          description: Prometheus cannot scrape the dedicated worker metrics listener on port 9102.
      - alert: AthensRedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Redis metrics are unavailable
          description: Prometheus cannot scrape redis-exporter.
      - alert: AthensQdrantExporterDown
        expr: up{job="qdrant"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Qdrant metrics are unavailable
          description: Prometheus cannot scrape Qdrant's native metrics endpoint.
      - alert: AthensRedisUnavailable
        expr: athens_health_status{component="redis"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis is unavailable
          description: Ranking and cache fallbacks are active.
      - alert: AthensRedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis is evicting keys
          description: Redis memory pressure is causing key evictions.
      - alert: AthensRedisPersistenceFailure
        expr: redis_aof_last_bgrewrite_status == 0 or redis_rdb_last_bgsave_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis persistence is unhealthy
          description: Redis reported a failed AOF rewrite or RDB save.
      - alert: AthensQdrantUnavailable
        expr: athens_health_status{component="qdrant"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Qdrant is unavailable
          description: Vector-search fallbacks are active.
      - alert: AthensQdrantHighErrorRate
        expr: athens:qdrant_error_rate:ratio > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Qdrant error rate is high
          description: More than five percent of Qdrant REST requests are failing.
      - alert: AthensQdrantHighLatency
        expr: athens:qdrant_p95_latency_seconds > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Qdrant latency is high
          description: Qdrant p95 REST response latency is above one second.

process_names:
  - name: mongod
    comm:
      - mongod
  - name: athens
    comm:
      - node
  - name: prometheus
    comm:
      - prometheus
  - name: grafana
    comm:
      - grafana
      - grafana-server
  - name: cadvisor
    comm:
      - cadvisor
  - name: alertmanager
    comm:
      - alertmanager
  - name: node-exporter
    comm:
      - node_exporter
  - name: blackbox-exporter
    comm:
      - blackbox_exporter
  - name: process-exporter
    comm:
      - process-exporter
  - name: docker
    comm:
      - dockerd
      - containerd
      - containerd-shim
      - containerd-shim-runc-v2
  # Last: every other process, named by executable, so /status can list Other.
  - name: "{{.Comm}}"
    cmdline:
      - '.+'

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=120d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - /opt/athens-monitoring/data/prometheus:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - redis-exporter
      - stackdriver-exporter

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-drwretail-bm}
      GCP_MONITORING_CLIENT_EMAIL: ${GCP_MONITORING_CLIENT_EMAIL:-monitoring-not-configured@example.invalid}
      GCP_MONITORING_PRIVATE_KEY: ${GCP_MONITORING_PRIVATE_KEY:-monitoring-not-configured}
    volumes:
      - /opt/athens-monitoring/data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.local.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/${ALERTMANAGER_CONFIG_FILE:-alertmanager.yml}:/etc/alertmanager/alertmanager.local.yml:ro
      - /opt/athens-monitoring/data/alertmanager:/alertmanager

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379

  stackdriver-exporter:
    image: prometheuscommunity/stackdriver-exporter:v0.19.0
    restart: unless-stopped
    command:
      - --google.project-ids=${GCP_PROJECT_ID:-drwretail-bm}
      - --monitoring.metrics-prefixes=firestore.googleapis.com/
      - --monitoring.metrics-prefixes=storage.googleapis.com/
      - --monitoring.metrics-interval=10m
      - --monitoring.metrics-ingest-delay
      - --monitoring.aggregate-deltas
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/monitoring-reader.json
    volumes:
      - ${GCP_MONITORING_CREDENTIALS_PATH:-/opt/athens-monitoring/secrets/monitoring-reader.json}:/run/secrets/monitoring-reader.json:ro

networks:
  default:
    name: athens-monitoring

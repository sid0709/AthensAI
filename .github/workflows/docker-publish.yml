# Build NextOffer and push to Docker Hub when a PR targets main or legacy master.
# On a main/master push or workflow_dispatch, also SSH-deploy to the VPS.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — e.g. omnimuh730
#   DOCKERHUB_TOKEN     — Docker Hub access token (not your password)
#   VPS_HOST            — e.g. 83.229.67.146
#   VPS_USER            — e.g. root
#   VPS_SSH_KEY         — private ed25519 key for deploy (PEM)
#
# Optional secrets / variables:
#   VPS_SSH_PORT        — default 22
#   DOCKER_IMAGE        — default: omnimuh730/nextoffer
#   GRAFANA_ADMIN_PASSWORD — optional; otherwise generated and persisted on the VPS
#   PUBLIC_ORIGIN       — public web origin baked into extension zips
#                         (e.g. https://sid.example.com or http://IP:9030).
#                         Default: http://$VPS_HOST:9030 (container nginx port map).

name: Docker publish

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bootstrap_firebase_runtime:
        description: Install or rotate the existing Firebase runtime credential
        type: boolean
        required: false
        default: false

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE || 'omnimuh730/nextoffer' }}

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install validation dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix Athens --ignore-scripts
          npm ci --prefix athens-backend --ignore-scripts

      # Shared DocumentId format check — packages/shared is kept forever.
      - name: Test shared document id
        run: node --test packages/shared/src/document-id.test.mjs

      - name: Build application services
        run: |
          npm run prisma:generate --prefix athens-backend
          npm run build --prefix athens-backend
          npm run build --prefix Athens

      - name: Validate deployment and monitoring configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: |
          bash -n docker/entrypoint.sh docker/deploy-remote.sh
          docker compose -f monitoring/docker-compose.yml config >/dev/null
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Google Cloud deployment identity
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_firebase_runtime
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/50997156169/locations/global/workloadIdentityPools/athensai-github-actions/providers/github-actions
          service_account: athens-deployer@drwretail-bm.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          TAGS=()

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR="${{ github.event.pull_request.number }}"
            # PR builds: do not overwrite :latest — use PR + sha tags for testing.
            TAGS+=("${IMAGE}:pr-${PR}")
            TAGS+=("${IMAGE}:pr-${PR}-${SHA_SHORT}")
            IMAGE_TAG="pr-${PR}-${SHA_SHORT}"
          else
            # main/master push / workflow_dispatch: update the live tags.
            TAGS+=("${IMAGE}:latest")
            TAGS+=("${IMAGE}:sha-${SHA_SHORT}")
            TAGS+=("${IMAGE}:amd64")
            # Date-based version for rollbacks (UTC).
            TAGS+=("${IMAGE}:$(date -u +%Y.%m.%d)-${SHA_SHORT}")
            IMAGE_TAG="sha-${SHA_SHORT}"
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
            echo "sha_short=${SHA_SHORT}"
            echo "image_tag=${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Will push:"
          printf '  %s\n' "${TAGS[@]}"

      # Extensions must hit container nginx (9030) or your host TLS vhost — not bare :80.
      # ATHENS_API_URL / WXT_API_URL bake as ${ORIGIN}/api (e.g. https://athensai.remotepairnet.net/api).
      - name: Resolve public origin
        id: origin
        shell: bash
        env:
          PUBLIC_ORIGIN_SECRET: ${{ secrets.PUBLIC_ORIGIN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [[ -n "${PUBLIC_ORIGIN_SECRET:-}" ]]; then
            ORIGIN="${PUBLIC_ORIGIN_SECRET}"
          else
            ORIGIN="http://${VPS_HOST}:9030"
          fi
          ORIGIN="${ORIGIN%/}"
          if [[ ! "${ORIGIN}" =~ ^https?:// ]]; then
            echo "error: PUBLIC_ORIGIN must be an http(s) URL, got: ${ORIGIN}" >&2
            exit 1
          fi
          {
            echo "origin=${ORIGIN}"
            echo "api_url=${ORIGIN}/api"
          } >> "$GITHUB_OUTPUT"
          echo "Extension public origin: ${ORIGIN}"
          echo "Extension API URL: ${ORIGIN}/api"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Match docker/publish.sh default — servers are linux/amd64.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            PUBLIC_ORIGIN=${{ steps.origin.outputs.origin }}
            WXT_API_URL=${{ steps.origin.outputs.api_url }}
            ATHENS_API_URL=${{ steps.origin.outputs.api_url }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nextoffer

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Docker image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ steps.meta.outputs.sha_short }}\` |"
            echo "| Deploy tag | \`${{ steps.meta.outputs.image_tag }}\` |"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull: \`docker pull ${IMAGE_NAME}:latest\` (main/master) or \`docker pull ${IMAGE_NAME}:pr-N\` (PR)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: nextoffer-vps-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud for VPS bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_firebase_runtime
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/50997156169/locations/global/workloadIdentityPools/athensai-github-actions/providers/github-actions
          service_account: athens-deployer@drwretail-bm.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI for VPS bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_firebase_runtime
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or rotate the Firebase VPS runtime credential
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_firebase_runtime
        shell: bash
        run: |
          set -euo pipefail
          project=drwretail-bm
          runtime=athens-vps-runtime@drwretail-bm.iam.gserviceaccount.com
          runtime_name="${runtime%@*}"
          bucket=drwretail-bm.firebasestorage.app

          # IAM service-account creation is eventually consistent. A successful
          # create can still be invisible to the policy APIs for several seconds.
          wait_for_service_account() {
            local account="$1"
            local attempt
            for attempt in $(seq 1 20); do
              if gcloud iam service-accounts describe "${account}" --project "${project}" >/dev/null 2>&1; then
                return 0
              fi
              if [ "${attempt}" -eq 20 ]; then
                echo "Timed out waiting for service account ${account} to propagate." >&2
                return 1
              fi
              echo "Waiting for ${account} to propagate (${attempt}/20)…"
              sleep 3
            done
          }

          # IAM policy writes can race propagation (and occasionally a concurrent
          # policy update). Retry only this bootstrap work with bounded backoff.
          retry_gcloud() {
            local label="$1"
            shift
            local attempt output delay
            for attempt in $(seq 1 8); do
              if output="$("$@" 2>&1)"; then
                return 0
              fi
              if [ "${attempt}" -eq 8 ]; then
                echo "${label} failed after ${attempt} attempts:" >&2
                echo "${output}" >&2
                return 1
              fi
              delay=$((attempt * 2))
              if [ "${delay}" -gt 10 ]; then delay=10; fi
              echo "${label} is not ready (${attempt}/8); retrying in ${delay}s…"
              sleep "${delay}"
            done
          }

          if ! gcloud iam service-accounts describe "${runtime}" --project "${project}" >/dev/null 2>&1; then
            gcloud iam service-accounts create "${runtime_name}" \
              --project "${project}" \
              --display-name "Athens VPS data runtime"
          fi

          wait_for_service_account "${runtime}"

          for role in roles/datastore.user roles/serviceusage.serviceUsageConsumer; do
            retry_gcloud "Grant ${role} to the VPS runtime" \
              gcloud projects add-iam-policy-binding "${project}" \
              --member "serviceAccount:${runtime}" \
              --role "${role}" \
              --condition=None \
              --quiet
          done
          retry_gcloud "Grant storage access to the VPS runtime" \
            gcloud storage buckets add-iam-policy-binding "gs://${bucket}" \
            --member "serviceAccount:${runtime}" \
            --role roles/storage.objectUser \
            --quiet
          retry_gcloud "Grant KMS access to the VPS runtime" \
            gcloud kms keys add-iam-policy-binding profile-secrets \
            --project "${project}" \
            --location us-east4 \
            --keyring athens \
            --member "serviceAccount:${runtime}" \
            --role roles/cloudkms.cryptoKeyEncrypterDecrypter \
            --quiet

          # scp-action archives sources with tar; a dot-prefixed directory is
          # skipped by its source glob and produces an empty archive.
          install -d -m 700 runtime-transfer
          gcloud iam service-accounts keys create \
            runtime-transfer/firebase-service-account.json \
            --iam-account "${runtime}" \
            --project "${project}"
          chmod 600 runtime-transfer/firebase-service-account.json

      - name: Transfer Firebase runtime credential
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_firebase_runtime
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/nextoffer-vps-key"
          cleanup() { rm -f "${key_file}"; }
          trap cleanup EXIT
          printf '%s\n' "${VPS_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          ssh_opts=(-i "${key_file}" -p "${VPS_SSH_PORT}" -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" "${VPS_USER}@${VPS_HOST}" \
            'install -d -m 700 /tmp/athens-vps-runtime'
          scp -i "${key_file}" -P "${VPS_SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            runtime-transfer/firebase-service-account.json \
            "${VPS_USER}@${VPS_HOST}:/tmp/athens-vps-runtime/"

      - name: Install Firestore VPS configuration
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_firebase_runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -eu
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo "$@"; fi
            }
            deploy_env=/opt/nextoffer/deploy.env
            secret_dir=/opt/nextoffer/secrets
            incoming=/tmp/athens-vps-runtime/firebase-service-account.json
            installed=${secret_dir}/firebase-service-account.json
            test -f "${deploy_env}"
            test -f "${incoming}"
            as_root install -d -m 700 "${secret_dir}"
            as_root install -m 600 "${incoming}" "${installed}"
            rm -rf /tmp/athens-vps-runtime
            as_root cp "${deploy_env}" "${deploy_env}.pre-firestore"

            set_env() {
              key="$1"
              value="$2"
              tmp="$(mktemp)"
              awk -v key="${key}" -v value="${value}" '
                BEGIN { found = 0 }
                index($0, key "=") == 1 { print key "=" value; found = 1; next }
                { print }
                END { if (!found) print key "=" value }
              ' "${deploy_env}" > "${tmp}"
              as_root install -m 600 "${tmp}" "${deploy_env}"
              rm -f "${tmp}"
            }

            set_env FIREBASE_PROJECT_ID drwretail-bm
            set_env FIREBASE_STORAGE_BUCKET drwretail-bm.firebasestorage.app
            set_env GOOGLE_APPLICATION_CREDENTIALS /run/secrets/firebase-service-account.json
            set_env FIREBASE_SECRET_HOST_PATH /opt/nextoffer/secrets/firebase-service-account.json
            set_env KMS_KEY_NAME projects/drwretail-bm/locations/us-east4/keyRings/athens/cryptoKeys/profile-secrets
            set_env FIREBASE_AUTH_REQUIRED false
            set_env BACKGROUND_WORKERS_MODE embedded
            set_env FIRESTORE_WRITES_ENABLED true

      - name: Sync deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: docker/deploy-remote.sh
          target: /opt/nextoffer/
          strip_components: 1

      - name: Sync monitoring configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: monitoring
          target: /opt/athens-monitoring/
          strip_components: 1

      - name: Pull image and recreate container
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: GRAFANA_ADMIN_PASSWORD
          command_timeout: 45m
          script: |
            set -eu
            echo "Preparing Athens monitoring and deployment"
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              elif command -v sudo >/dev/null 2>&1; then
                sudo "$@"
              else
                echo "Root or passwordless sudo is required for VPS provisioning." >&2
                exit 1
              fi
            }
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed; installing Docker Engine and Compose."
              if command -v apt-get >/dev/null 2>&1; then
                as_root apt-get update
                if ! as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2; then
                  as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-plugin
                fi
              elif command -v dnf >/dev/null 2>&1; then
                as_root dnf install -y docker docker-compose-plugin
              else
                echo "Unsupported VPS package manager; install Docker Engine manually." >&2
                exit 1
              fi
            fi
            if command -v systemctl >/dev/null 2>&1; then
              as_root systemctl enable --now docker || as_root systemctl start docker
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "Docker is installed but unavailable to the SSH user." >&2
              docker --version >&2 || true
              exit 1
            fi
            echo "Docker prerequisite is ready: $(docker --version)"
            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              echo "Docker Compose is not installed; installing the Compose plugin."
              if command -v apt-get >/dev/null 2>&1; then
                as_root apt-get update
                if ! as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose-v2; then
                  as_root env DEBIAN_FRONTEND=noninteractive apt-get install -y docker-compose-plugin
                fi
              elif command -v dnf >/dev/null 2>&1; then
                as_root dnf install -y docker-compose-plugin
              else
                echo "Unsupported VPS package manager; install Docker Compose manually." >&2
                exit 1
              fi
            fi
            deploy_source=""
            for candidate in \
              /opt/nextoffer/deploy-remote.sh \
              /opt/nextoffer/docker/deploy-remote.sh \
              /opt/nextoffer/deploy.sh; do
              if [ -f "$candidate" ]; then
                deploy_source="$candidate"
                break
              fi
            done
            if [ -z "$deploy_source" ]; then
              echo "Could not find the synced deploy script under /opt/nextoffer." >&2
              find /opt/nextoffer -maxdepth 3 -type f -print 2>/dev/null || true
              exit 1
            fi
            if [ "$deploy_source" != /opt/nextoffer/deploy.sh ]; then
              cp "$deploy_source" /opt/nextoffer/deploy.sh
            fi
            chmod 755 /opt/nextoffer/deploy.sh
            echo "Deploy script staged from ${deploy_source}"
            echo "Preparing monitoring directories"
            as_root install -d -m 750 /opt/athens-monitoring/alertmanager \
              /opt/athens-monitoring/data/prometheus \
              /opt/athens-monitoring/data/grafana \
              /opt/athens-monitoring/data/alertmanager
            echo "Monitoring directories are ready"
            if [ "$(id -u)" -eq 0 ]; then
              chown 65534:65534 /opt/athens-monitoring/data/prometheus /opt/athens-monitoring/data/alertmanager
              chown 472:472 /opt/athens-monitoring/data/grafana
            elif command -v sudo >/dev/null 2>&1; then
              sudo chown 65534:65534 /opt/athens-monitoring/data/prometheus /opt/athens-monitoring/data/alertmanager
              sudo chown 472:472 /opt/athens-monitoring/data/grafana
            else
              echo "Cannot set monitoring data ownership: root or sudo is required." >&2
              exit 1
            fi
            echo "Monitoring data ownership is ready"
            # Google Cloud Monitoring is no longer part of this stack. Remove
            # a legacy reader key if an earlier deployment left one behind.
            as_root rm -f /opt/athens-monitoring/secrets/monitoring-reader.json
            grafana_password="${GRAFANA_ADMIN_PASSWORD:-}"
            if [ -z "$grafana_password" ] && [ -f /opt/athens-monitoring/.env ]; then
              grafana_password="$(awk -F= '$1 == "GRAFANA_ADMIN_PASSWORD" {print substr($0, index($0, "=") + 1)}' /opt/athens-monitoring/.env)"
            fi
            grafana_password="${grafana_password:-$(openssl rand -hex 24)}"
            alertmanager_config_file=alertmanager.yml
            umask 077
            monitoring_env_tmp="$(mktemp)"
            printf 'GRAFANA_ADMIN_USER=admin\nGRAFANA_ADMIN_PASSWORD=%s\nGRAFANA_ROOT_URL=http://127.0.0.1:3000\nALERTMANAGER_CONFIG_FILE=%s\n' \
              "$grafana_password" "$alertmanager_config_file" > "$monitoring_env_tmp"
            as_root install -o "$(id -u)" -g "$(id -g)" -m 600 \
              "$monitoring_env_tmp" /opt/athens-monitoring/.env
            rm -f "$monitoring_env_tmp"
            echo "Monitoring environment file is installed"
            echo "Alertmanager is configured for internal visibility only; no outbound receiver is installed."
            if docker compose version >/dev/null 2>&1; then
              compose_cmd="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              compose_cmd="docker-compose"
            else
              echo "Docker Compose is not installed on the VPS; install the Docker Compose plugin or docker-compose." >&2
              docker --version >&2 || true
              exit 1
            fi
            export GRAFANA_ADMIN_USER=admin
            export GRAFANA_ADMIN_PASSWORD="$grafana_password"
            export GRAFANA_ROOT_URL=http://127.0.0.1:3000
            export ALERTMANAGER_CONFIG_FILE="$alertmanager_config_file"
            echo "Using ${compose_cmd} for Athens monitoring"
            echo "Validating monitoring Compose configuration"
            ${compose_cmd} --env-file /opt/athens-monitoring/.env -f /opt/athens-monitoring/docker-compose.yml config >/dev/null
            echo "Pulling monitoring images"
            ${compose_cmd} --env-file /opt/athens-monitoring/.env -f /opt/athens-monitoring/docker-compose.yml pull
            echo "Starting monitoring services"
            ${compose_cmd} --env-file /opt/athens-monitoring/.env -f /opt/athens-monitoring/docker-compose.yml up -d
            echo "Reloading Prometheus recording and alert rules"
            ${compose_cmd} --env-file /opt/athens-monitoring/.env -f /opt/athens-monitoring/docker-compose.yml restart prometheus
            echo "Starting Athens application deploy"
            /opt/nextoffer/deploy.sh "${{ needs.build-and-push.outputs.image_tag }}"

            docker exec nextoffer node --input-type=module -e '
              const response = await fetch("http://127.0.0.1:8980/readyz", { signal: AbortSignal.timeout(5000) });
              const payload = await response.json();
              if (!response.ok || !payload.ok) process.exit(1);
            '
            echo "Verified athens-backend readiness."

      - name: Summary
        shell: bash
        run: |
          {
            echo "## VPS deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Host | \`${{ secrets.VPS_HOST }}\` |"
            echo "| Image | \`${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}\` |"
            echo "| Commit | \`${{ needs.build-and-push.outputs.sha_short }}\` |"
            echo ""
            echo "Health: athens-backend /readyz and public /api/status/current checks run on the VPS."
            echo "Monitoring: Prometheus/Grafana/Alertmanager are maintained by the same SSH deploy."
            echo "Rollback: \`ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '/opt/nextoffer/deploy.sh sha-<old>'\`"
          } >> "$GITHUB_STEP_SUMMARY"
